<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P2P Lantern Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="identity">
          <div class="avatar"></div>
          <div>
            <h1 class="title">Lantern Chat</h1>
            <p class="subtitle">Connected as <strong>{{ device_name }}</strong></p>
          </div>
        </div>
        <div class="status-pill" id="network-status">Discovering peers…</div>
      </header>
      <div class="app-body">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2>Nearby Devices</h2>
            <button class="refresh" id="refresh-contacts" title="Refresh contact list">↻</button>
          </div>
          <div class="contacts" id="contact-list"></div>
          <div class="cookie-note">Known contacts are saved in your browser cookies for instant reconnection.</div>
        </aside>
        <main class="chat-area">
          <div class="chat-tabs" id="chat-tabs"></div>
          <section class="chat-panel" id="chat-panel">
            <div class="placeholder" id="chat-placeholder">
              <h2>Start a conversation</h2>
              <p>Pick any device from the left to launch a secure peer-to-peer chat or share files instantly.</p>
            </div>
            <div class="conversation" id="conversation" hidden>
              <header class="conversation-header">
                <div>
                  <h2 id="conversation-name"></h2>
                  <p id="conversation-address"></p>
                </div>
              </header>
              <div class="message-scroll" id="message-list"></div>
              <form class="composer" id="message-form">
                <textarea id="message-input" placeholder="Type a message" rows="1"></textarea>
                <div class="composer-actions">
                  <label class="file-upload">
                    <input type="file" id="file-input" hidden />
                    <span>📎</span>
                  </label>
                  <button type="submit" class="send-button">Send</button>
                </div>
              </form>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
